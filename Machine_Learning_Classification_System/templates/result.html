<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Model Evaluation Result</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>🤖 Machine Learning Classification System</h1>

    <p class="subtitle">Model Evaluation Result</p>

    <div class="result-box">

        <h2>Selected Model</h2>

        <p><strong>{{ model_name }}</strong></p>

        <table class="metrics-table">

            <tr>
                <th>Accuracy</th>
                <td>{{ accuracy }} %</td>
            </tr>

            <tr>
                <th>Precision</th>
                <td>{{ precision }} %</td>
            </tr>

            <tr>
                <th>Recall</th>
                <td>{{ recall }} %</td>
            </tr>

            <tr>
                <th>F1 Score</th>
                <td>{{ f1 }} %</td>
            </tr>

        </table>

    </div>

    <div class="result-box">

        <h2>Confusion Matrix</h2>

        <img src="{{ url_for('static', filename='confusion_matrix.png') }}" alt="Confusion Matrix">

    </div>

    <div class="result-box">

        <h2>Classification Report</h2>

        <pre>{{ report }}</pre>

    </div>

    <br>

    <a href="/">

        <button>⬅ Back To Home</button>

    </a>

</div>

</body>

</html>
