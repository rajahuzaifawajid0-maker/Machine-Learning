<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

</head>

<body>

    <h1>House Price Prediction using XGBoost</h1>

    <form action="/predict" method="POST">

        <label>Area :</label>
        <input type="number" name="Area" required>

        <br><br>

        <label>Bedrooms :</label>
        <input type="number" name="Bedrooms" required>

        <br><br>

        <label>Bathrooms :</label>
        <input type="number" name="Bathrooms" required>

        <br><br>

        <label>Floors :</label>
        <input type="number" name="Floors" required>

        <br><br>

        <label>Year Built :</label>
        <input type="number" name="YearBuilt" required>

        <br><br>

        <label>Location :</label>
        <input type="number" name="Location" required>

        <br><br>

        <label>Condition :</label>
        <input type="number" name="Condition" required>

        <br><br>

        <label>Garage :</label>
        <input type="number" name="Garage" required>

        <br><br>

        <button type="submit">

            Predict Price

        </button>

    </form>

</body>

</html>
